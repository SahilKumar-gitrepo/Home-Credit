version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: credit_underwriting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/credit_underwriting
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1:8b
      CORS_ORIGINS: '["http://localhost:3001", "http://127.0.0.1:3001"]'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./policies:/app/policies

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8002
    depends_on:
      - backend

volumes:
  postgres_data:

# NOTE: Ollama must be run separately on the host machine.
# Run: ollama serve
# Pull: ollama pull llama3.1:8b
# The backend will function without Ollama for deterministic underwriting.
# Only the AI assistant chat requires Ollama.
